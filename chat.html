<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PRUDENCE AI - Architectural Chat Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #000000;
      --panel: #050505;
      --border: #ffffff;
      --primary: #ffffff;
      --primary-hover: #000000;
      --text: #ffffff;
      --glow: rgba(255, 255, 255, 0.8);
    }
    @keyframes glitch {
      0% { transform: translate(0) }
      20% { transform: translate(-2px, 2px) }
      40% { transform: translate(-2px, -2px) }
      60% { transform: translate(2px, 2px) }
      80% { transform: translate(2px, -2px) }
      100% { transform: translate(0) }
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.2) 0%, transparent 50%),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, transparent 1px, transparent 10px);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    /* Split layout */
    .sidebar {
      width: 320px;
      background: var(--panel);
      border-right: 4px solid var(--border);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: inset -10px 0 30px rgba(255,255,255,0.1);
    }
    .sidebar-header {
      padding: 24px;
      border-bottom: 2px solid var(--border);
      font-weight: 900;
      letter-spacing: 6px;
      color: var(--bg);
      background: var(--primary);
      text-transform: uppercase;
      font-size: 14px;
      text-shadow: 0 0 5px var(--glow);
      text-align: center;
      animation: glitch 3s infinite;
    }
    .violations-list {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .violation-card {
      background: var(--bg);
      border: 2px solid var(--border);
      padding: 16px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.1s;
      position: relative;
      box-shadow: 4px 4px 0 var(--border);
    }
    .violation-card:hover {
      background: var(--primary);
      color: var(--bg);
      transform: translate(-4px, -4px);
      box-shadow: 8px 8px 0 var(--border);
    }
    .violation-card:hover .violation-title, .violation-card:hover .violation-meta {
      color: var(--bg);
    }
    .violation-title {
      font-weight: 900;
      margin-bottom: 6px;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
    }
    .violation-meta {
      font-weight: bold;
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--primary);
    }
    
    /* Main Chat Panel */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: transparent;
      position: relative;
    }
    .chat-header {
      padding: 24px 30px;
      border-bottom: 4px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      text-transform: uppercase;
      letter-spacing: 4px;
      font-weight: 900;
      box-shadow: 0 10px 20px rgba(255,255,255,0.05);
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .message {
      max-width: 80%;
      padding: 16px 24px;
      font-weight: 600;
      font-size: 14px;
      position: relative;
      border: 2px solid var(--border);
      box-shadow: 4px 4px 0 var(--border);
      animation: slideUp 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .message.user {
      align-self: flex-end;
      background: var(--primary);
      color: var(--bg);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .message.ai {
      align-self: flex-start;
      background: var(--bg);
      color: var(--primary);
      font-family: "Courier New", monospace;
      letter-spacing: 1px;
    }
    .message.ai table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
    }
    .message.ai th, .message.ai td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
    }
    .message.ai th {
      background: rgba(255,255,255,0.1);
    }
    .message.ai p {
      margin: 8px 0;
    }
    .message.ai ul, .message.ai ol {
      margin: 8px 0;
      padding-left: 24px;
    }
    .chat-input-container {
      padding: 30px 40px;
      background: var(--bg);
      border-top: 4px solid var(--border);
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .chat-input-wrapper {
      flex: 1;
      position: relative;
    }
    .chat-input-wrapper input {
      width: 100%;
      box-sizing: border-box;
      background: var(--bg);
      border: 2px solid var(--border);
      color: var(--primary);
      padding: 20px 24px;
      font-size: 16px;
      font-family: "Courier New", monospace;
      font-weight: bold;
      outline: none;
      transition: all 0.2s;
      box-shadow: 4px 4px 0 var(--border);
    }
    .chat-input-wrapper input:focus {
      background: var(--primary);
      color: var(--bg);
      box-shadow: 8px 8px 0 var(--border);
      transform: translate(-2px, -2px);
    }
    .chat-input-wrapper input::placeholder {
      color: rgba(255,255,255,0.4);
    }
    .chat-input-wrapper input:focus::placeholder {
      color: rgba(0,0,0,0.5);
    }
    .send-btn {
      background: var(--primary);
      color: var(--bg);
      border: 2px solid var(--border);
      padding: 0 40px;
      height: 64px;
      font-weight: 900;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 4px;
      cursor: pointer;
      transition: all 0.1s;
      box-shadow: 4px 4px 0 var(--border);
    }
    .send-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--border);
      background: var(--bg);
      color: var(--primary);
    }
    .send-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 var(--border);
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <span>📐 BLUEPRINT COMPLIANCE</span>
    </div>
    <div class="violations-list" id="violations-list">
      <!-- Dynamic Violations -->
    </div>
  </div>
  <div class="chat-container">
    <div class="chat-header">
      <div style="font-weight: 600; font-size: 16px; color: var(--primary);">💬 PRUDENCE AI Assistant</div>
    </div>
    <div class="chat-messages" id="chat-messages">
      <div class="message ai">Hello! I am PRUDENCE. I've loaded your blueprint analysis. Ask me any compliance or construction questions about this plan!</div>
    </div>
    <div class="chat-input-container">
      <div class="chat-input-wrapper">
        <input type="text" id="chat-input" placeholder="Ask about room sizes, height compliance, ventilation..." onkeypress="if(event.key==='Enter') sendChatMessage()">
      </div>
      <button class="send-btn" onclick="sendChatMessage()">Send</button>
    </div>
  </div>

  <script>
    var chatHistory = [];
    var analysis = {};

    // Load from LocalStorage
    try {
      var stored = localStorage.getItem('prudence_analysis');
      if (stored) {
        analysis = JSON.parse(stored);
        renderViolations();
      }
    } catch(e) {
      console.error("Failed to parse analysis:", e);
    }

    function renderViolations() {
      var list = document.getElementById('violations-list');
      list.innerHTML = '';
      var violations = analysis.violations || [];
      if(violations.length === 0) {
        list.innerHTML = '<div style="opacity: 0.5; font-size:12px; padding:20px; text-align:center;">No violations loaded. Upload a plan first!</div>';
        return;
      }
      violations.forEach(function(v) {
        var card = document.createElement('div');
        card.className = 'violation-card';
        card.onclick = function() {
          var input = document.getElementById('chat-input');
          input.value = "Tell me more about: " + v.title;
          input.focus();
        };
        card.innerHTML = '<div class="violation-title">' + escapeHtml(v.title) + '</div>' +
                         '<div class="violation-meta">Severity: ' + escapeHtml(v.severity || 'Medium') + '</div>';
        list.appendChild(card);
      });
    }

    function escapeHtml(str) {
      if(!str) return '';
      return str.toString()
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function sendChatMessage() {
      var input = document.getElementById('chat-input');
      var text = input.value.trim();
      if (!text) return;
      
      input.value = '';
      var msgs = document.getElementById('chat-messages');
      msgs.innerHTML += '<div class="message user">' + escapeHtml(text) + '</div>';
      msgs.scrollTop = msgs.scrollHeight;
      
      chatHistory.push({role: 'user', content: text});
      
      fetch('/api/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          history: chatHistory.slice(0, -1),
          message: text,
          analysis: analysis
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.error) {
          msgs.innerHTML += '<div class="message ai" style="color:#ef4444;">Error: ' + escapeHtml(data.error) + '</div>';
        } else {
          chatHistory.push({role: 'model', content: data.response});
          msgs.innerHTML += '<div class="message ai">' + marked.parse(data.response) + '</div>';
        }
        msgs.scrollTop = msgs.scrollHeight;
      })
      .catch(err => {
        msgs.innerHTML += '<div class="message ai" style="color:#ef4444;">Failed to connect to assistant.</div>';
        msgs.scrollTop = msgs.scrollHeight;
      });
    }
  </script>
</body>
</html>
